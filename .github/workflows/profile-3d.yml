name: 3D Contribution Graph

on:
  schedule:
    - cron: "0 4 * * *" # Se actualiza solo cada día a las 04:00 UTC
  workflow_dispatch:    # Permite ejecutarlo manualmente cuando quieras

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
